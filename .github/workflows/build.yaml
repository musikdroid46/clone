name: Build CloneSpace APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan source (unzip kalau ada .zip di root)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort | tail -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Pakai zip: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
          fi
          GR=$(find . -name gradlew -type f | head -n1)
          if [ -z "$GR" ]; then
            echo "gradlew tidak ditemukan"; exit 1
          fi
          ROOT=$(dirname "$GR")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project dir: $ROOT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools, NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneSpace-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
